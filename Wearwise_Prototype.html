const matchReasons=(p,original)=>{const f=data.prefs;const reasons=[];if(!data.notifications.browser)return {ok:false,reason:'Browser shopping assistant notifications are off.'};if(!f.second&&!p.verified)return {ok:false,reason:'Second-hand options are turned off.'};if(f.price&&p.price+p.delivery>=original)return {ok:false,reason:'The alternative is not cheaper including delivery.'};if(f.style&&(!f.styles.length||!f.styles.some(s=>p.styles.includes(s))))return {ok:false,reason:'The alternative does not match your selected styles.'};if(f.material&&(!f.materials.length||!f.materials.includes(p.material)))return {ok:false,reason:'The alternative does not match your selected materials.'};if(p.price+p.delivery<original)reasons.push(`${money(original-p.price-p.delivery)} cheaper including delivery`);if(!p.verified)reasons.push('Second-hand');if(f.style)reasons.push('Matches your '+f.styles.find(s=>p.styles.includes(s))+' style');if(f.material)reasons.push('Matches your '+p.material.toLowerCase()+' preference');return {ok:true,reasons}};

class="small" style="margin-top:10px">Linen blend relaxed shirt</p><strong>£35.99</strong><br><span class="muted">Free delivery · sample price</span><br><button class="retail-btn" data-act="basket">ADD TO BASKET</button></div>${show?`<aside class="notification-card" role="region" aria-label="Shopping assistant notification"><div class="between"><span class="brand">wearwise</span><button aria-label="Dismiss notification" data-act="dismiss">${I('close')}</button></div>${label(scenario==='alternative'?'Cheaper · kinder':'Already yours')}<div class="row" style="margin-top:7px">${img(scenario==='alternative'?'shirt':owned.img,scenario==='alternative'?p.name:owned.name,'thumb')}<div style="min-width:0"><strong class="small">${scenario==='alternative'?E(p.name):E(owned.name)}</strong><p class="muted">${scenario==='alternative'?E(p.brand)+' · '+p.source:'Already in your wardrobe'}</p>${scenario==='alternative'?`<strong>${money(p.price)}</strong><p class="muted">${money(p.price+p.delivery)} delivered</p>`:'<strong>Free to rewear</strong>'}</div></div><div class="why">${scenario==='alternative'?m.reasons.map(x=>'✓ '+E(x)).join('<br>'):'✓ Similar item already owned<br>✓ Style it instead of buying new'}</div>${btn(scenario==='alternative'?'View in app':'View outfit inspiration',scenario==='alternative'?'product:shirt':'style-this:'+E(owned.id),'')}</aside>`:''}</div><div class="panel"><h3>${show?'Why this popped up':'Why there is no pop-up'}</h3><p class="small">${show?(scenario==='alternative'?'A similar item matches every preference you have turned on, so the assistant shows it in a small pop-up at the top right.':'You already own something similar. Wearwise offers a free alternative using your wardrobe. Wardrobe reminders are separate from product-price and fabric filters.'):(dismissed?'You dismissed the notification. You can continue shopping without interruption.':scenario==='alternative'?E(m.reason):'No matching wardrobe item is available or browser notifications are off.')}</p><div class="pref-head" style="margin:13px 0"><div><strong>Allow browser shopping assistant notifications</strong></div>${switcher('notif:browser',data.notifications.browser,'Allow browser shopping assistant notifications')}</div>${btn('Edit my preferences','go:profile','secondary full')}${dismissed?`<div class="spacer"></div>${btn('Show preview again','restore','secondary full')}`:''}</div><p class="notice">Simulated retailer page. No real browser extension is installed.</p>`}`};
const filterModal=()=>`<header><h2>Filters</h2><button data-act="close-modal" aria-label="Close filters">${I('close')}</button></header><div class="modal-body"><div class="filter-section">${label('Category')}<div class="chips">${categories.map(x=>chip(x,draft.cats.includes(x),'f:cats:'+x)).join('')}</div></div><div class="filter-section">${label('Material')}<div class="chips">${materials.map(x=>chip(x,draft.materials.includes(x),'f:materials:'+x)).join('')}</div></div><div class="filter-section">${label('Budget · up to '+money(draft.budget))}<input id="budget" aria-label="Maximum budget" type="range" min="10" max="200" step="1" value="${draft.budget}"></div><div class="filter-section">${label('Sustainability')}<div class="filter-toggle"><div><strong>Verified credentials only</strong><p class="muted">Brand rated Good or Great</p></div>${switcher('ft:verified',draft.verified,'Verified credentials only')}</div><div class="filter-toggle"><div><strong>Second-hand only</strong><p class="muted">Nothing newly made</p></div>${switcher('ft:second',draft.second,'Second-hand only')}</div></div><div class="filter-section">${label('Source')}<div class="chips">${sources.map(x=>chip(x,draft.sources.includes(x),'f:sources:'+x)).join('')}</div></div><button class="inline-link" data-act="reset-filters">Reset filters</button></div><footer>${btn('Show '+filterItems(draft).length+' pieces','apply-filters','full')}</footer>`;
const outfitModal=()=>`<header><h2>Filter outfits</h2><button data-act="close-modal" aria-label="Close outfit filters">${I('close')}</button></header><div class="modal-body"><p class="muted">Narrow by how you dress, where you’re going and the weather.</p>${[['style',['Minimal','Casual','Vintage','Tailored','Romantic','Classic','Y2K','Streetwear','Cottagecore']],['occasion',['Uni','Work','Weekend','Evening']],['season',['Spring','Summer','Autumn','Winter']]].map(([g,opts])=>`<div class="filter-section">${label(g)}<div class="chips">${opts.map(t=>chip(t,draft[g].includes(t),'of:'+g+':'+t)).join('')}</div></div>`).join('')}<button class="inline-link" data-act="reset-of">Reset filters</button></div><footer>${btn('Show '+outfitResults(draft).length+' outfits','apply-of','full')}</footer>`;
const imageModal=()=>`<header><h2>Image search</h2><button data-act="close-modal" aria-label="Close">${I('close')}</button></header><div class="modal-body"><p>Upload an inspiration image, then select the closest clothing type to search our demo catalogue.</p><label class="field"><span>Choose image</span><input type="file" accept="image/*" id="image-search-file"></label>${photoQuery?img(photoQuery,'Uploaded search image','') :''}<p class="muted">Visual AI matching is simulated through category selection.</p><div class="chips" style="margin-top:12px">${categories.map(x=>chip(x,false,'image-cat:'+x)).join('')}</div></div>`;
const renderModal=()=>{const el=document.getElementById('overlay');if(!modal){el.innerHTML='';return}let html=modal==='filters'?filterModal():modal==='outfits'?outfitModal():modal==='image'?imageModal():modal==='reset'?`<header><h2>Reset demo?</h2><button data-act="close-modal" aria-label="Close">${I('close')}</button></header><div class="modal-body"><p>This will remove local preferences, saved items and uploaded clothing, and return to the sign-up screen.</p></div><footer>${btn('Sign out & reset','confirm-reset','full')}<div class="spacer"></div>${btn('Cancel','close-modal','secondary full')}</footer>`:`<header><h2>Remove item?</h2><button data-act="close-modal" aria-label="Close">${I('close')}</button></header><div class="modal-body"><p>Remove this piece from your virtual wardrobe?</p></div><footer>${btn('Remove item','confirm-remove','full')}${btn('Cancel','close-modal','secondary full')}</footer>`;el.innerHTML=`<div class="modal-backdrop" data-backdrop><section class="modal" role="dialog" aria-modal="true" aria-label="${modal==='filters'?'Filters':modal==='outfits'?'Filter outfits':modal==='image'?'Image search':'Confirm action'}">${html}</section></div>`;if(modal==='image'){const i=el.querySelector('img');if(i)i.style.cssText='width:100%;max-height:180px;object-fit:contain;border-radius:8px'}};
const views={signup:startPage,setup,style:chooseStyle,shop,saved,detail,source:sourcePage,wardrobe,add,wardDetail,inspo,profile,preview};
const render=(keepScroll=false)=>{const y=window.scrollY;const isNav=['shop','saved','wardrobe','inspo','profile'].includes(page);document.getElementById('app').innerHTML=`<div class="shell"><main class="screen ${isNav?'':'no-nav'}">${(views[page]||shop)()}</main>${isNav?nav():''}</div>`;renderModal();if(keepScroll)window.scrollTo(0,y)};
const toggle=(arr,v)=>arr.includes(v)?arr.filter(x=>x!==v):[...arr,v];
const updateSearch=()=>{const ps=filterItems();document.getElementById('results-count').textContent=`${ps.length} pieces for you`;document.getElementById('results').innerHTML=ps.map(p=>card(p)).join('')||empty('search','No pieces found','Try changing your search or filters.','Clear filters','clear-all')};
const readPhoto=(f,cb)=>{if(!f)return;if(!f.type.startsWith('image/'))return toast('Please select an image.');if(f.size>20*1024*1024)return toast('Choose an image smaller than 20 MB.');const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const scale=Math.min(1,720/Math.max(im.width,im.height)),canvas=document.createElement('canvas');canvas.width=Math.round(im.width*scale);canvas.height=Math.round(im.height*scale);canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);cb(canvas.toDataURL('image/jpeg',.83))};im.onerror=()=>toast('This image could not be opened.');im.src=r.result};r.readAsDataURL(f)};
const action=(a)=>{const [k,v,...rest]=a.split(':');const val=rest.join(':');switch(k){case'go':go(v);return;case'back':go(prev||'shop');return;case'continue-setup':if(data.prefs.material&&!data.prefs.materials.length){toast('Select at least one preferred material.');return}go('style');return;case'finish-setup':if(data.prefs.style&&!data.prefs.styles.length){toast('Choose at least one style, or turn Style off.');return}data.setupComplete=true;save();go('shop');return;case'pref':data.prefs[v]=!data.prefs[v];save();render(true);return;case'prefstyle':data.prefs.styles=toggle(data.prefs.styles,v);save();render(true);return;case'prefmaterial':data.prefs.materials=toggle(data.prefs.materials,v);save();render(true);return;case'save-prefs':if(data.prefs.material&&!data.prefs.materials.length||data.prefs.style&&!data.prefs.styles.length){toast('Choose a style or material for each enabled preference.');return}save();toast('Preferences saved');return;case'notif':data.notifications[v]=!data.notifications[v];dismissed=false;save();render(true);toast(data.notifications[v]?'Notifications on':'Notifications off');return;case'cat':cat=v;render(true);return;case'wcat':wcat=v;render(true);return;case'filters':draft=structuredClone(data.filters);modal='filters';renderModal();return;case'outfit-filters':draft=structuredClone(data.of);modal='outfits';renderModal();return;case'f':draft[v]=toggle(draft[v],val);renderModal();return;case'ft':draft[v]=!draft[v];if(draft[v]&&v==='verified')draft.second=false;if(draft[v]&&v==='second')draft.verified=false;renderModal();return;case'of':draft[v]=toggle(draft[v],val);renderModal();return;case'apply-filters':data.filters=draft;modal=null;save();render(true);return;case'apply-of':data.of=draft;outfitIndex=0;modal=null;save();render(true);return;case'reset-filters':draft=blankFilters();renderModal();return;case'reset-of':draft=blankOutfit();renderModal();return;case'clear-all':data.filters=blankFilters();cat='All';q='';save();render(true);return;case'clear-outfit':data.of=blankOutfit();focusOutfit=null;outfitIndex=0;save();render(true);return;case'close-modal':modal=null;renderModal();return;case'product':selectedProduct=v;sourceFrom=page==='preview'?'preview':page==='saved'?'saved':'shop';go('detail');return;case'save':data.saved=toggle(data.saved,v);save();render(true);toast(data.saved.includes(v)?'Saved to wishlist':'Removed from wishlist');return;case'buy':selectedProduct=v;go('source');return;case'wardrobe-item':selectedWardrobe=v;go('wardDetail');return;case'wear':{const w=data.wardrobe.find(w=>w.id===v);w.worn++;save();render(true);toast('Wear logged');return}case'remove-wardrobe':selectedWardrobe=v;modal='remove';renderModal();return;case'confirm-remove':data.wardrobe=data.wardrobe.filter(w=>w.id!==selectedWardrobe);save();go('wardrobe');toast('Item removed');return;case'style-this':focusOutfit=v;data.of=blankOutfit();outfitIndex=0;go('inspo');return;case'clear-focus':focusOutfit=null;outfitIndex=0;render(true);return;case'pass':case'keep':{const os=outfitResults(),o=os[outfitIndex%os.length];if(!o)return;if(k==='keep'){data.kept.push(o.title);toast('Outfit kept')}else{data.passed++;toast('Outfit passed')}outfitIndex++;save();render(true);return}case'open-preview':previewMode=v;dismissed=false;go('preview');return;case'scenario':scenario=v;dismissed=false;render(true);return;case'dismiss':dismissed=true;render(true);toast('Notification dismissed');return;case'restore':dismissed=false;render(true);return;case'basket':toast('Added to basket on the simulated retailer.');return;case'image-search':modal='image';photoQuery='';renderModal();return;case'image-cat':cat=v;q='';modal=null;render(true);toast('Showing matching category');return;case'reset':modal='reset';renderModal();return;case'confirm-reset':data=fresh();try{localStorage.removeItem(KEY)}catch{};q='';cat='All';wcat='All';focusOutfit=null;outfitIndex=0;uploadImage='';uploadName='';dismissed=false;go('signup');return;}};
const prepareBackground=(url,choice,cb)=>{if(choice==='Original'){cb(url);return}const image=new Image();image.onload=()=>{const c=document.createElement('canvas');c.width=image.width;c.height=image.height;const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(image,0,0);const d=x.getImageData(0,0,c.width,c.height),a=d.data,w=c.width,h=c.height,n=w*h;const corners=[0,w-1,(h-1)*w,n-1].map(i=>[a[i*4],a[i*4+1],a[i*4+2]]);const avg=corners[0].map((v,k)=>Math.round(corners.reduce((sum,t)=>sum+t[k],0)/4));const distance=(r,g,b)=>Math.sqrt((r-avg[0])**2+(g-avg[1])**2+(b-avg[2])**2);if(corners.some(v=>distance(...v)>68)){cb(url);return}const seen=new Uint8Array(n),queue=new Int32Array(n);let head=0,tail=0;const enqueue=i=>{if(i<0||i>=n||seen[i])return;seen[i]=1;if(distance(a[i*4],a[i*4+1],a[i*4+2])<57)queue[tail++]=i};for(let j=0;j<w;j++){enqueue(j);enqueue((h-1)*w+j)}for(let j=0;j<h;j++){enqueue(j*w);enqueue(j*w+w-1)}const bg=choice==='White'?[255,255,255]:[242,242,231];while(head<tail){const i=queue[head++],p=i*4;a[p]=bg[0];a[p+1]=bg[1];a[p+2]=bg[2];if(i%w>0)enqueue(i-1);if(i%w<w-1)enqueue(i+1);enqueue(i-w);enqueue(i+w)}if(tail/n>.8){cb(url);return}x.putImageData(d,0,0);cb(c.toDataURL('image/jpeg',.86))};image.onerror=()=>cb(url);image.src=url};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-go]');if(b){e.preventDefault();if(b.dataset.go){if(b.dataset.go==='inspo')focusOutfit=null;go(b.dataset.go)}else action(b.dataset.act)}else if(e.target.matches('[data-backdrop]')){modal=null;renderModal()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){q=e.target.value;updateSearch()}if(e.target.id==='budget'){draft.budget=Number(e.target.value);const sect=e.target.closest('.filter-section');sect.querySelector('.eyebrow').textContent='Budget · up to '+money(draft.budget);document.querySelector('.modal footer button').textContent='Show '+filterItems(draft).length+' pieces'}if(page==='add'&&e.target.name==='name')uploadName=e.target.value});
document.addEventListener('change',e=>{if(['upload-photo','take-photo','gallery-photo'].includes(e.target.id)){readPhoto(e.target.files[0],url=>{uploadImage=url;const el=document.querySelector('.upload');if(el){const old=el.querySelector('div');if(old)old.remove();const oldim=el.querySelector('img');if(oldim)oldim.remove();el.insertAdjacentHTML('afterbegin',img(url,'Uploaded clothing preview'))}toast('Photo added')})}if(e.target.id==='image-search-file')readPhoto(e.target.files[0],url=>{photoQuery=url;renderModal()})});
document.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(e.target);if(e.target.id==='signup'){data.account={name:fd.get('name').trim(),city:fd.get('city').trim()};save();go('setup')}if(e.target.id==='add-form'){if(!uploadImage){toast('Please upload a photo.');return}if(!fd.get('name').trim()){toast('Enter an item name.');return}const addBtn=e.target.querySelector('button[type=submit]');addBtn.disabled=true;addBtn.textContent='Adding item…';prepareBackground(uploadImage,fd.get('background'),url=>{data.wardrobe.unshift({id:'w'+Date.now(),img:url,name:fd.get('name').trim(),category:fd.get('category'),colour:fd.get('colour'),background:fd.get('background'),worn:0});save();uploadImage='';uploadName='';wcat='All';go('wardrobe');toast('Item added to your wardrobe')})}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;renderModal()}});document.addEventListener('touchstart',e=>{if(e.target.closest('#swipe-card'))swipeStart={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});document.addEventListener('touchend',e=>{if(!swipeStart)return;const dx=e.changedTouches[0].clientX-swipeStart.x,dy=e.changedTouches[0].clientY-swipeStart.y;if(Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)*1.4)action(dx>0?'keep':'pass');swipeStart=null},{passive:true});
render();
